services:
  - type: web
    name: farmerpricealert
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn backend.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure random value
      - key: DATABASE_URL
        sync: false                  # Paste your Railway PostgreSQL URL here
      - key: SITE_DOMAIN
        value: farmerpricealert.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: GOV_API_KEY
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false                  # Admin panel login email
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false                  # Admin panel login username
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false                  # Admin panel login password
      - key: FRONTEND_URL
        sync: false                  # e.g. https://your-frontend.vercel.app (optional)
      - key: PYTHON_VERSION
        value: "3.11.0"

<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link as="style"
        href="https://fonts.googleapis.com/css2?display=swap&family=Inter%3Awght%40400%3B500%3B700%3B900&family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
        onload="this.rel='stylesheet'" rel="stylesheet" />

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <title>Market Prices - Agriprice</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 50;
            max-height: 200px;
            overflow-y: auto;
            background: white;
            border: 1px solid #dce5dd;
            border-radius: 8px;
            margin-top: 4px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }
        .autocomplete-dropdown .ac-item {
            padding: 8px 12px;
            font-size: 13px;
            color: #121713;
            cursor: pointer;
            transition: background 0.15s;
        }
        .autocomplete-dropdown .ac-item:hover {
            background: #f1f4f1;
        }
        .autocomplete-dropdown .ac-item .ac-highlight {
            font-weight: 700;
            color: #1c5e21;
        }
        .autocomplete-dropdown .ac-empty {
            padding: 8px 12px;
            font-size: 12px;
            color: #68826b;
        }
    </style>
</head>

<body>
    <div class="relative flex h-auto min-h-screen w-full flex-col bg-white group/design-root overflow-x-hidden"
        style='font-family: Inter, "Noto Sans", sans-serif;'>

        <div class="layout-container flex h-full grow flex-col">
            <header
                class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#f1f4f1] px-10 py-3">
                <div class="flex items-center gap-4 text-[#121713]">
                    <div
                        style="background: #2ecc71; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 8px; box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);">
                        <i data-lucide="leaf" color="white" size="24" style="margin: 0;"></i>
                    </div>
                    <h2 class="text-[#121713] text-lg font-bold leading-tight tracking-[-0.015em]">Agriprice</h2>
                </div>

                <div class="flex flex-1 justify-end gap-8">
                    <div class="flex items-center gap-9">
                        <a class="text-[#121713] text-sm font-medium leading-normal" href="/dashboard/">
                            Dashboard
                        </a>

                        <a class="text-[#121713] text-sm font-bold leading-normal border-b-2 border-[#1c5e21]"
                            href="/market-prices/">
                            Market Prices
                        </a>

                        <a class="text-[#121713] text-sm font-medium leading-normal" href="/profile/">
                            Profile
                        </a>

                    </div>

                    <div class="relative">
                        <button id="notif-btn" onclick="toggleNotifications()"
                            class="relative flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 bg-[#f1f4f1] text-[#121713] gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5 focus:outline-none focus:ring-2 focus:ring-[#2ecc71]/50">
                            <div class="text-[#121713]">
                                <svg fill="currentColor" height="20px" width="20px" viewBox="0 0 256 256">
                                    <path
                                        d="M221.8,175.94C216.25,166.38,208,139.33,208,104a80,80,0,1,0-160,0c0,35.34-8.26,62.38-13.81,71.94A16,16,0,0,0,48,200H88.81a40,40,0,0,0,78.38,0H208a16,16,0,0,0,13.8-24.06ZM128,216a24,24,0,0,1-22.62-16h45.24A24,24,0,0,1,128,216ZM48,184c7.7-13.24,16-43.92,16-80a64,64,0,1,1,128,0c0,36.05,8.28,66.73,16,80Z">
                                    </path>
                                </svg>
                            </div>
                            <span id="notif-badge"
                                class="hidden absolute -top-1 -right-1 min-w-5 px-1 h-5 rounded-full bg-[#e53935] text-white text-[11px] font-bold flex items-center justify-center shadow-md"></span>
                        </button>

                        <div id="notif-dropdown"
                            class="hidden absolute right-0 mt-2 w-80 rounded-xl bg-white/95 backdrop-blur border border-[#dce5dd] shadow-[0_20px_40px_rgba(0,0,0,0.12)] ring-1 ring-[#dce5dd]/60 overflow-hidden z-10">
                            <div class="flex items-center justify-between px-4 py-2 border-b border-[#dce5dd]">
                                <p class="text-sm font-semibold text-[#121713]">Notifications</p>
                                <button onclick="refreshNotifications()"
                                    class="text-xs text-[#2ecc71] font-bold">Refresh</button>
                            </div>
                            <div id="notif-list" class="max-h-80 overflow-y-auto divide-y divide-[#eef4ef]">
                                <div class="px-4 py-3 text-sm text-[#68826b]">Loading...</div>
                            </div>
                        </div>
                    </div>
                    <div class="relative">
                        <button id="avatarBtn" aria-expanded="false" aria-controls="avatarMenu"
                            class="bg-center bg-no-repeat bg-cover rounded-full size-10 border border-[#e1e8e2] shadow-sm focus:outline-none focus:ring-2 focus:ring-[#2ecc71]/40"
                            style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCMI0aj8z-fKpwRFRqm3H2fgWoUmyVdRo4v7l2cZvtNijAixlFnixesfG48ILRaM0Gl7NgWIBh1vq8nb0rRAh5o9YYTctLqoq0rXQOMTuEzntySGR1CLWn_SR5RJ63iWIpt2bzFZ71uLiXV8zyzwcBkfvX15-lE7wz8G6Gj91RSRV8hicyV1xYJyyHJPgAurF3dHY09opRTyECXuFg2FsYDBeJ9NHaxB5eZOvGbIQvoZxGY-LdMMj-IQKi6zNtlkQ9NIlVEAAglV4s");'>
                        </button>
                        <div id="avatarMenu"
                            class="hidden absolute right-0 mt-2 w-44 rounded-xl bg-white/90 backdrop-blur border border-[#e6efe7] shadow-[0_20px_50px_rgba(0,0,0,0.08)] ring-1 ring-[#e6efe7]/60 overflow-hidden">
                            <a href="/profile/"
                                class="flex items-center gap-2 px-4 py-2.5 text-sm text-[#121713] hover:bg-[#f1f5f1]">
                                Manage Profile
                            </a>
                            <button onclick="logout()"
                                class="w-full text-left flex items-center gap-2 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50">
                                Logout
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <div class="px-40 flex flex-1 justify-center py-5">
                <div class="layout-content-container flex flex-col max-w-[1100px] flex-1">

                    <div class="flex flex-wrap justify-between gap-3 p-4">
                        <div class="flex min-w-72 flex-col gap-3">
                            <p class="text-[#121713] text-[32px] font-bold">Market Prices</p>
                            <p class="text-[#68826b] text-sm">
                                Real-time prices from mandis across the country. Updated daily.
                            </p>
                        </div>
                    </div>

                    <div class="flex flex-col gap-4 p-4">

                        <div class="flex flex-wrap items-center gap-4 rounded-xl bg-[#f1f4f1] p-4">
                            <div class="flex flex-1 min-w-[200px] flex-col gap-1">
                                <label class="text-xs font-bold text-[#121713]">Search Crop</label>
                                <div class="relative">
                                    <input id="filter-crop" autocomplete="off"
                                        class="w-full rounded-lg bg-white p-2 text-sm text-[#121713] shadow-sm focus:ring-2 focus:ring-[#1c5e21]"
                                        placeholder="e.g. Wheat, Rice" type="text"
                                        oninput="handleAutocomplete(this, 'crop')" />
                                    <span
                                        class="material-symbols-outlined absolute right-2 top-2 text-[#68826b] text-lg">
                                        search
                                    </span>
                                    <div id="dropdown-crop" class="autocomplete-dropdown hidden"></div>
                                </div>
                            </div>

                            <div class="flex flex-1 min-w-[200px] flex-col gap-1">
                                <label class="text-xs font-bold text-[#121713]">State</label>
                                <div class="relative">
                                    <input id="filter-state" placeholder="Type state name" autocomplete="off"
                                        class="w-full rounded-lg bg-white p-2 text-sm text-[#121713] shadow-sm focus:ring-2 focus:ring-[#1c5e21]"
                                        oninput="handleAutocomplete(this, 'state')" />
                                    <div id="dropdown-state" class="autocomplete-dropdown hidden"></div>
                                </div>
                            </div>

                            <div class="flex flex-1 min-w-[200px] flex-col gap-1">
                                <label class="text-xs font-bold text-[#121713]">District</label>
                                <div class="relative">
                                    <input id="filter-district" placeholder="Type district name" autocomplete="off"
                                        class="w-full rounded-lg bg-white p-2 text-sm text-[#121713] shadow-sm focus:ring-2 focus:ring-[#1c5e21]"
                                        oninput="handleAutocomplete(this, 'district')" />
                                    <div id="dropdown-district" class="autocomplete-dropdown hidden"></div>
                                </div>
                            </div>

                            <div class="flex flex-1 min-w-[200px] flex-col gap-1">
                                <label class="text-xs font-bold text-[#121713]">Mandi Name</label>
                                <div class="relative">
                                    <input id="filter-mandi" placeholder="Type mandi name" autocomplete="off"
                                        class="w-full rounded-lg bg-white p-2 text-sm text-[#121713] shadow-sm focus:ring-2 focus:ring-[#1c5e21]"
                                        oninput="handleAutocomplete(this, 'mandi')" />
                                    <div id="dropdown-mandi" class="autocomplete-dropdown hidden"></div>
                                </div>
                            </div>

                            <div class="flex flex-col gap-1 justify-end">
                                <label class="text-xs font-bold text-transparent select-none">Action</label>
                                <button onclick="applyFilters()"
                                    class="flex items-center justify-center gap-2 rounded-lg bg-[#1c5e21] px-5 py-2 text-sm font-bold text-white shadow-sm hover:bg-[#144718]">
                                    <span class="material-symbols-outlined text-lg">filter_alt</span>
                                    Apply
                                </button>

                            </div>
                        </div>


                        <div
                            class="hidden md:grid grid-cols-12 gap-4 px-4 py-3 border-b border-[#e0e5e0] text-sm font-bold text-[#68826b]">
                            <div class="col-span-3">Crop Name</div>
                            <div class="col-span-3">Mandi Location</div>
                            <div class="col-span-2 text-right">Min Price (₹/Q)</div>
                            <div class="col-span-2 text-right">Max Price (₹/Q)</div>
                            <div class="col-span-2 text-right">Last Updated</div>
                        </div>

                        <div class="flex flex-col gap-2" id="market-list">
                        </div>

                        <div class="flex justify-center items-center gap-4 mt-6 mb-10">
                            <button id="prevBtn" onclick="changePage(-1)"
                                class="rounded-lg bg-[#e0e5e0] px-4 py-2 text-sm font-bold text-[#121713] disabled:opacity-50 disabled:cursor-not-allowed">
                                Previous
                            </button>
                            <span id="pageIndicator" class="text-sm font-semibold text-[#121713]">Page 1</span>
                            <button id="nextBtn" onclick="changePage(1)"
                                class="rounded-lg bg-[#1c5e21] px-4 py-2 text-sm font-bold text-white hover:bg-[#144718] disabled:opacity-50 disabled:cursor-not-allowed">
                                Next
                            </button>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let CURRENT_PAGE = 1;

        // Add this anywhere inside your <script> tag
        document.addEventListener("DOMContentLoaded", () => {
            fetch("/api/profile/me/", { credentials: "include" })
                .then(res => res.json())
                .then(data => {
                    if (data.profile_image) {
                        const avatarBtn = document.getElementById("avatarBtn");
                        if (avatarBtn) {
                            avatarBtn.style.backgroundImage = `url("${data.profile_image}")`;
                        }
                    }
                })
                .catch(err => console.error("Profile sync failed:", err));

            initAvatarMenu();
            loadMarketPrices();
            fetchNotifications();
            setInterval(fetchNotifications, 30000);
        });
        // Base API URL configuration
        const API_BASE_URL = "/api/gov/market-prices/";

        function initAvatarMenu() {
            const avatarBtn = document.getElementById("avatarBtn");
            const avatarMenu = document.getElementById("avatarMenu");

            if (!avatarBtn || !avatarMenu) return;

            const closeMenu = () => {
                avatarMenu.classList.add("hidden");
                avatarBtn.setAttribute("aria-expanded", "false");
            };

            avatarBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                const isHidden = avatarMenu.classList.toggle("hidden");
                avatarBtn.setAttribute("aria-expanded", isHidden ? "false" : "true");
            });

            document.addEventListener("click", (e) => {
                if (!avatarMenu.classList.contains("hidden")) {
                    const target = e.target;
                    if (target !== avatarBtn && !avatarMenu.contains(target)) {
                        closeMenu();
                    }
                }
            });

            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") closeMenu();
            });
        }

        async function loadMarketPrices(page = 1) {
            CURRENT_PAGE = page;
            const container = document.getElementById("market-list");
            container.innerHTML = "Loading...";

            // Update buttons state
            document.getElementById("prevBtn").disabled = (page <= 1);
            document.getElementById("pageIndicator").textContent = `Page ${page}`;

            try {
                // Determine if we are filtering or just loading defaults
                const crop = document.getElementById("filter-crop").value.trim();
                const state = document.getElementById("filter-state").value.trim();
                const district = document.getElementById("filter-district").value.trim();
                const mandi = document.getElementById("filter-mandi").value.trim();

                const url = new URL(API_BASE_URL, window.location.origin);
                url.searchParams.append('page', page);
                if (crop) url.searchParams.append('crop', crop);
                if (state) url.searchParams.append('state', state);
                if (district) url.searchParams.append('district', district);
                if (mandi) url.searchParams.append('mandi', mandi);
                url.searchParams.append('_t', Date.now());

                const res = await fetch(url, { credentials: "include" });
                const data = await res.json();
                renderData(data.prices || []);

            } catch (err) {
                console.error(err);
                container.innerHTML = "Failed to load market prices.";
            }
        }

        function changePage(delta) {
            const newPage = CURRENT_PAGE + delta;
            if (newPage < 1) return;
            loadMarketPrices(newPage);
        }

        function applyFilters() {
            CURRENT_PAGE = 1; // Reset to page 1 on filter
            loadMarketPrices(1);
        }

        function renderData(prices) {
            const container = document.getElementById("market-list");
            container.innerHTML = "";

            if (!prices || prices.length === 0) {
                container.innerHTML = "No results found.";
                return;
            }

            prices.forEach(item => {
                const row = document.createElement("div");
                row.className =
                    "group flex flex-col md:grid md:grid-cols-12 gap-2 md:gap-4 items-center rounded-xl bg-white p-4 shadow-[0_1px_3px_rgba(0,0,0,0.08)] hover:shadow-[0_4px_6px_rgba(0,0,0,0.08)] transition-all border border-transparent hover:border-[#dce5dc]";

                // Powerful defensive check for all possible keys
                const cropName = item.crop_name || item.crop || item.commodity || "N/A";
                const mandiName = item.mandi_name || item.market || "N/A";
                const stateName = item.state || "N/A";

                row.innerHTML = `
                    <div class="col-span-3 flex items-center gap-3 w-full md:w-auto">
                      <div class="h-10 w-10 shrink-0 rounded-full bg-[#f1f4f1] flex items-center justify-center font-bold">
                        ${cropName.substring(0, 2).toUpperCase()}
                      </div>
                      <div>
                        <p class="font-bold text-[#121713]">${cropName}</p>
                        <p class="text-xs text-[#68826b] md:hidden">${mandiName}, ${stateName}</p>
                      </div>
                    </div>

                    <div class="col-span-3 hidden md:block">
                      <p class="font-medium">${mandiName}</p>
                      <p class="text-xs text-[#68826b]">${stateName}</p>
                    </div>

                    <div class="col-span-2 text-right">
                      <span class="font-medium text-[#121713]">₹${item.min_price || '0'}</span>
                    </div>

                    <div class="col-span-2 text-right">
                      <span class="font-bold text-[#1c5e21]">₹${item.max_price || '0'}</span>
                    </div>

                    <div class="col-span-2 text-right">
                      <span class="text-xs text-[#68826b]">${item.date || "N/A"}</span>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        async function logout() {
            try {
                const res = await fetch("/api/logout/");
                if (res.ok) {
                    window.location.href = "/login/";
                } else {
                    alert("Logout failed");
                }
            } catch (err) {
                console.error(err);
                alert("Logout failed");
            }
        }

        async function fetchNotifications(markSeen = false) {
            try {
                const res = await fetch("/api/notifications/", { credentials: "include" });
                const data = await res.json();

                updateNotifBadge(data.unseen_count || 0);
                renderNotifications(data.items || []);

                if (markSeen && data.unseen_count > 0) {
                    await markNotificationsSeen();
                    updateNotifBadge(0);
                }
            } catch (err) {
                console.error("Failed to load notifications", err);
            }
        }

        function updateNotifBadge(count) {
            const badge = document.getElementById("notif-badge");
            if (!badge) return;

            if (count > 0) {
                badge.textContent = count > 9 ? "9+" : count;
                badge.classList.remove("hidden");
            } else {
                badge.classList.add("hidden");
            }
        }

        function renderNotifications(items) {
            const list = document.getElementById("notif-list");
            if (!list) return;

            if (!items.length) {
                list.innerHTML = '<div class="px-4 py-3 text-sm text-[#68826b]">No notifications yet.</div>';
                return;
            }

            list.innerHTML = items.map(item => {
                const statusDot = item.is_seen ? "bg-[#dce5dd]" : "bg-[#2ecc71]";
                return `
                    <div class="px-4 py-3 flex gap-3 items-start hover:bg-[#f9fbf9]">
                        <span class="mt-1 inline-block size-2 rounded-full ${statusDot}"></span>
                        <div class="flex-1">
                            <p class="text-sm text-[#121713] font-semibold">${item.crop} @ ${item.market}</p>
                            <p class="text-sm text-[#4b6d4f] leading-snug">${item.message || "Alert triggered"}</p>
                            <p class="text-xs text-[#8aa38c] mt-1">${item.created_at}</p>
                        </div>
                    </div>
                `;
            }).join("");
        }

        async function markNotificationsSeen() {
            try {
                await fetch("/api/notifications/mark-seen/", {
                    method: "POST",
                    credentials: "include"
                });
            } catch (err) {
                console.error("Failed to mark notifications seen", err);
            }
        }

        function toggleNotifications() {
            const dropdown = document.getElementById("notif-dropdown");
            if (!dropdown) return;

            const isHidden = dropdown.classList.contains("hidden");
            dropdown.classList.toggle("hidden");

            if (isHidden) {
                fetchNotifications(true);
            }
        }

        function refreshNotifications() {
            fetchNotifications();
        }

        document.addEventListener("click", (event) => {
            const dropdown = document.getElementById("notif-dropdown");
            const btn = document.getElementById("notif-btn");
            if (!dropdown || !btn) return;

            if (!dropdown.classList.contains("hidden") && !dropdown.contains(event.target) && event.target !== btn && !btn.contains(event.target)) {
                dropdown.classList.add("hidden");
            }
        });

        // ===== AUTOCOMPLETE LOGIC =====
        let acDebounceTimer = null;

        function handleAutocomplete(inputEl, fieldName) {
            clearTimeout(acDebounceTimer);
            const query = inputEl.value.trim();
            const dropdown = document.getElementById(`dropdown-${fieldName}`);

            if (query.length < 2) {
                dropdown.classList.add("hidden");
                dropdown.innerHTML = "";
                return;
            }

            acDebounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`/api/autocomplete/?field=${fieldName}&q=${encodeURIComponent(query)}`, {
                        credentials: "include"
                    });
                    const data = await res.json();
                    renderDropdown(dropdown, data.suggestions || [], query, inputEl, fieldName);
                } catch (err) {
                    console.error("Autocomplete error:", err);
                    dropdown.classList.add("hidden");
                }
            }, 250); // 250ms debounce
        }

        function renderDropdown(dropdown, suggestions, query, inputEl, fieldName) {
            dropdown.innerHTML = "";

            if (suggestions.length === 0) {
                dropdown.innerHTML = '<div class="ac-empty">No suggestions found</div>';
                dropdown.classList.remove("hidden");
                return;
            }

            suggestions.forEach(item => {
                const div = document.createElement("div");
                div.className = "ac-item";
                // Highlight the matching part
                const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                div.innerHTML = item.replace(regex, '<span class="ac-highlight">$1</span>');
                div.addEventListener("click", () => {
                    inputEl.value = item;
                    dropdown.classList.add("hidden");
                    dropdown.innerHTML = "";
                });
                dropdown.appendChild(div);
            });

            dropdown.classList.remove("hidden");
        }

        // Close dropdowns when clicking outside
        document.addEventListener("click", (e) => {
            document.querySelectorAll(".autocomplete-dropdown").forEach(dd => {
                if (!dd.parentElement.contains(e.target)) {
                    dd.classList.add("hidden");
                }
            });
        });

        lucide.createIcons();
    </script>

</body>

</html>

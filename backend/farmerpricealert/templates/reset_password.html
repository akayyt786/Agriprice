{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | AgriPrice Premium</title>
    <meta name="description" content="Reset your AgriPrice password securely.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
        rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #2ecc71;
            --primary-dark: #27ae60;
            --secondary: #27ae60;
            --accent: #f1c40f;
            --text-dark: #0f172a;
            --text-light: #64748b;
            --white: #ffffff;
            --bg-mesh: radial-gradient(at 0% 0%, hsla(145, 63%, 91%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(150, 60%, 88%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(140, 50%, 92%, 1) 0, transparent 50%);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.4);
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: #f8fafc;
            background-image: var(--bg-mesh);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 900px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            overflow: hidden;
            box-shadow: var(--shadow);
            position: relative;
            transform: translateY(0);
            transition: var(--transition);
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12);
        }

        .image-panel {
            flex: 1.2;
            position: relative;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .image-panel h2 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .image-panel p {
            font-size: 15px;
            opacity: 0.9;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .icon-display {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .form-panel {
            flex: 1;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-header {
            margin-bottom: 30px;
        }

        .form-header h2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .form-header p {
            color: var(--text-light);
            font-size: 14px;
        }

        .reset-form {
            display: flex;
            flex-direction: column;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: var(--text-light);
            transition: var(--transition);
            z-index: 1;
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            border: 2px solid #f1f5f9;
            background: #f8fafc;
            border-radius: 16px;
            font-size: 15px;
            color: var(--text-dark);
            outline: none;
            transition: var(--transition);
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.15);
        }

        .input-wrapper input:focus + i {
            color: var(--primary);
        }

        .password-strength {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }

        .strength-bar {
            height: 4px;
            flex: 1;
            border-radius: 2px;
            background: #e2e8f0;
            transition: background 0.3s;
        }

        .reset-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white);
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
            box-shadow: 0 10px 25px rgba(46, 204, 113, 0.3);
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(46, 204, 113, 0.4);
        }

        .reset-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .back-to-login {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-light);
        }

        .back-to-login a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .back-to-login a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
            }

            .image-panel {
                padding: 40px 20px;
                min-height: 300px;
            }

            .form-panel {
                padding: 40px 20px;
            }

            .image-panel h2 {
                font-size: 24px;
            }

            .form-header h2 {
                font-size: 22px;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Left Panel: Visual -->
        <div class="image-panel">
            <div class="icon-display">
                <i data-lucide="lock" size="60" color="white"></i>
            </div>
            <h2>Secure Your Account</h2>
            <p>Create a strong password to keep your AgriPrice account safe and secure.</p>
        </div>

        <!-- Right Panel: Form -->
        <div class="form-panel">
            <div class="form-header">
                <h2>Reset Password</h2>
                <p>Enter your new password below</p>
            </div>

            <form class="reset-form" onsubmit="submitResetPassword(event);">
                <div class="input-group">
                    <label for="newPassword">New Password</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock" size="20"></i>
                        <input 
                            type="password" 
                            id="newPassword" 
                            placeholder="••••••••" 
                            required
                            onchange="checkPasswordStrength()"
                            oninput="checkPasswordStrength()">
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar" id="bar1"></div>
                        <div class="strength-bar" id="bar2"></div>
                        <div class="strength-bar" id="bar3"></div>
                        <div class="strength-bar" id="bar4"></div>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock" size="20"></i>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            placeholder="••••••••" 
                            required>
                    </div>
                </div>

                <button type="submit" class="reset-btn">Reset Password</button>
                <div id="message" class="message"></div>
            </form>

            <div class="back-to-login">
                Remember your password? <a href="/login/">Back to login</a>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function checkPasswordStrength() {
            const password = document.getElementById("newPassword").value;
            let strength = 0;

            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z\d]/.test(password)) strength++;

            // Update strength bars
            for (let i = 1; i <= 4; i++) {
                const bar = document.getElementById(`bar${i}`);
                if (i <= strength) {
                    bar.style.background = i <= 1 ? '#f39c12' : i <= 2 ? '#e67e22' : '#2ecc71';
                } else {
                    bar.style.background = '#e2e8f0';
                }
            }
        }

        async function submitResetPassword(event) {
            event.preventDefault();

            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const messageDiv = document.getElementById("message");
            const button = document.querySelector(".reset-btn");

            // Validation
            if (newPassword.length < 8) {
                messageDiv.className = "message error";
                messageDiv.innerText = "Password must be at least 8 characters long";
                return;
            }

            if (newPassword !== confirmPassword) {
                messageDiv.className = "message error";
                messageDiv.innerText = "Passwords do not match";
                return;
            }

            // Get uid and token from URL
            const urlParams = new URLSearchParams(window.location.search);
            const uid = urlParams.get("uid");
            const token = urlParams.get("token");

            if (!uid || !token) {
                messageDiv.className = "message error";
                messageDiv.innerText = "Invalid reset link. Please request a new one.";
                return;
            }

            button.disabled = true;

            try {
                const res = await fetch("/api/password-reset/confirm/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        uid: uid,
                        token: token,
                        new_password: newPassword
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    messageDiv.className = "message error";
                    messageDiv.innerText = data.detail || "Failed to reset password";
                    button.disabled = false;
                    return;
                }

                messageDiv.className = "message success";
                messageDiv.innerText = data.detail || "Password reset successfully! Redirecting to login...";

                // Redirect to login after 2 seconds
                setTimeout(() => {
                    window.location.href = "/login/";
                }, 2000);
            } catch (err) {
                console.error(err);
                messageDiv.className = "message error";
                messageDiv.innerText = "An error occurred. Please try again.";
                button.disabled = false;
            }
        }

        // Check for invalid link on page load
        window.addEventListener("load", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const uid = urlParams.get("uid");
            const token = urlParams.get("token");

            if (!uid || !token) {
                const messageDiv = document.getElementById("message");
                messageDiv.className = "message error";
                messageDiv.innerText = "Invalid or expired reset link. Please request a new one.";
                document.querySelector(".reset-form").style.display = "none";
            }
        });
    </script>
</body>

</html>
